<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Arc</title>
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <div class="top">
    <nav class="nav-row">
      <button id="back" class="icon-btn" title="Back">
        <svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="forward" class="icon-btn" title="Forward">
        <svg viewBox="0 0 16 16"><path d="m6 3 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="reload" class="icon-btn" title="Reload (Shift-click to bypass cache)">
        <svg viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.6-3.7M13 2.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </nav>

    <!-- Empty slot; extras/userChrome.css places Firefox's extension buttons over it.
         It sits above the address bar so the address dropdown never slides under it. -->
    <div id="ext-slot" class="ext-slot"></div>

    <div id="address" class="address">
      <span id="lock" class="lock">
        <svg viewBox="0 0 16 16"><rect x="3.5" y="7" width="9" height="6.5" rx="1.5" fill="currentColor"/><path d="M5.5 7V5.5a2.5 2.5 0 0 1 5 0V7" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      </span>
      <span id="addr-icon" class="addr-icon"></span>
      <input id="url" type="text" spellcheck="false" autocomplete="off" placeholder="Search or enter address">
      <button id="copy-url" class="icon-btn copy" title="Copy URL">
        <svg viewBox="0 0 16 16"><rect x="5.5" y="5.5" width="8" height="8" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 3.5A1.5 1.5 0 0 0 9 2.5H4A1.5 1.5 0 0 0 2.5 4v5A1.5 1.5 0 0 0 3.5 10.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      </button>
      <ul id="suggest" class="suggest" hidden></ul>
    </div>
  </div>

  <section id="favorites" class="fav-grid" aria-label="Favorites"></section>

  <div class="scroll">
    <header id="space-head" class="space-head" title="Show or hide pinned tabs">
      <span class="chevron" aria-hidden="true">
        <svg viewBox="0 0 16 16"><path d="m6 3.5 4.5 4.5L6 12.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span id="space-icon" class="space-emoji"></span>
      <span id="space-name" class="space-title"></span>
      <button id="space-more" class="icon-btn space-more" title="Space options">
        <svg viewBox="0 0 16 16"><circle cx="3.5" cy="8" r="1.3" fill="currentColor"/><circle cx="8" cy="8" r="1.3" fill="currentColor"/><circle cx="12.5" cy="8" r="1.3" fill="currentColor"/></svg>
      </button>
    </header>
    <ul id="pinned" class="tab-list" aria-label="Pinned"></ul>

    <div class="divider-row">
      <div class="divider"></div>
      <button id="new-tab-link" class="link-btn" title="Open the command bar in a new tab">New Tab</button>
      <span class="link-dot" aria-hidden="true">·</span>
      <button id="clear" class="link-btn" title="Close all unpinned tabs in this space">Clear</button>
    </div>

    <button id="new-tab" class="new-tab"><span class="plus">+</span> New Tab</button>
    <ul id="today" class="tab-list grow" aria-label="Tabs"></ul>
  </div>

  <footer id="spaces" class="spaces">
    <div class="space-list"></div>
    <button class="add-space icon-btn" title="New Space">
      <svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </footer>

  <div id="menu" class="menu" role="menu" hidden></div>
  <div id="dialog" class="dialog" hidden></div>

  <script src="../shared/store.js"></script>
  <script type="module" src="sidebar.js"></script>
</body>
</html>
