<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>New Tab</title>
  <link rel="stylesheet" href="../palette/palette.css">
  <link rel="stylesheet" href="newtab.css">
  <script src="../shared/tint.js"></script>
  <!-- Runs before anything paints: hands the tab to Arc (command bar). -->
  <script src="newtab.js"></script>
</head>
<body>
  <!-- A still copy of the command bar: Firefox shows this tab for a frame or
       two before Arc's real one takes over, and the swap shouldn't be seen. -->
  <div class="bar">
    <div class="field">
      <span class="field-icon">
        <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m10.5 10.5 3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </span>
      <input id="q" type="text" tabindex="-1" aria-hidden="true" disabled placeholder="Search or Enter URL…">
      <span class="hint"></span>
    </div>
    <ul class="list"></ul>
  </div>
</body>
</html>
